      <text x="812" y="120">StarRocks</text>
      <text x="812" y="162">Spark</text>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     filter="url(#textShadow)">
    <text x="194" y="78" text-anchor="middle"
          font-size="17" font-weight="800" letter-spacing="0" fill="#CFFAFE">Open Index</text>
    <path d="M128 92H260" stroke="#67E8F9" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
    <path d="M146 104H242" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" opacity="0.82"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     filter="url(#textShadow)">
    <text x="480" y="104" text-anchor="middle"
          font-size="78" font-weight="850" letter-spacing="0" fill="#F8FAFC">ParqDB</text>
