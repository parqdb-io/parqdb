<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">ParqDB</title>
  <desc id="desc">ParqDB wordmark with one open vector index flowing into DataFusion, StarRocks, and Spark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.46" stop-color="#0B2E34"/>
      <stop offset="1" stop-color="#1D2548"/>
    </linearGradient>
    <linearGradient id="flow" x1="80" y1="146" x2="826" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.34" stop-color="#34D399"/>
      <stop offset="0.68" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="branch" x1="682" y1="104" x2="806" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="flowGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.180 0 0 0 0 0.820 0 0 0 0 0.760 0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="220" rx="34" fill="url(#bg)"/>

  <g opacity="0.18" fill="none" stroke="#E0F2FE" stroke-width="1">
    <path d="M88 54C184 30 274 34 358 72"/>
    <path d="M52 170C154 98 258 86 360 128"/>
    <path d="M598 44C704 20 798 28 890 72"/>
    <path d="M594 178C706 124 802 132 904 178"/>
  </g>

  <path d="M90 142C176 78 264 76 352 118C458 168 552 166 650 101C676 90 700 96 722 110C696 111 672 115 652 122C554 185 456 188 346 135C260 94 178 98 91 158C86 154 86 146 90 142Z"
        fill="url(#flow)" opacity="0.78" filter="url(#flowGlow)"/>
  <path d="M94 151C178 91 260 88 348 128C454 176 552 173 652 112C674 101 696 104 714 112"
        fill="none" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" opacity="0.26"/>
  <path d="M102 160C198 112 282 112 368 146C468 184 558 178 650 128C674 118 694 117 712 116"
