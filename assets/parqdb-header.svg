    <circle cx="264" cy="96" r="7"/>
    <circle cx="398" cy="146" r="7"/>
    <circle cx="548" cy="158" r="7"/>
  </g>
  <g fill="#22D3EE" opacity="0.92">
    <circle cx="132" cy="122" r="4"/>
    <circle cx="398" cy="146" r="4"/>
  </g>
  <g fill="#34D399" opacity="0.92">
    <circle cx="264" cy="96" r="4"/>
    <circle cx="548" cy="158" r="4"/>
  </g>

  <path d="M652 104C682 96 708 101 732 111C754 105 768 91 782 80C792 74 804 73 814 76C798 79 786 85 772 98C758 110 750 117 734 120C758 119 782 116 806 113C812 113 816 114 820 116C816 118 812 119 806 119C782 119 758 120 734 122C752 127 766 140 782 152C794 160 802 162 814 158C802 166 790 165 780 158C762 147 752 131 732 122C706 126 682 124 652 117Z"
        fill="url(#branch)" opacity="0.42" filter="url(#flowGlow)"/>

  <g fill="none" stroke="url(#branch)" stroke-width="3.2" stroke-linecap="round" opacity="0.46">
    <path d="M704 111C732 109 752 94 770 84C784 78 796 77 806 79"/>
    <path d="M704 115C736 115 772 116 806 116"/>
    <path d="M704 118C732 121 752 138 770 150C784 156 796 157 804 154"/>
  </g>
  <g fill="none" stroke="#F8FAFC" stroke-width="1.15" stroke-linecap="round" opacity="0.18">
    <path d="M724 110C752 104 768 84 804 79"/>
    <path d="M724 115C756 115 782 116 804 116"/>
    <path d="M724 119C752 128 768 148 802 154"/>
  </g>

  <g filter="url(#textShadow)">
