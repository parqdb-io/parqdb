[package]
name = "full-text-storage-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
arrow = "=58.3.0"
bytes = "1.11.1"
datafusion = { version = "=54.1.0", default-features = false, features = ["parquet", "sql"] }
futures = "0.3.31"
parquet = { version = "=58.3.0", features = ["async"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
zstd = "0.13.3"

[[bin]]
name = "page-size"
path = "src/main.rs"

[[bin]]
name = "large-text"
path = "src/bin/large_text.rs"

[[bin]]
name = "datafusion-payload"
path = "src/bin/datafusion_payload.rs"
