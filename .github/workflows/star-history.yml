name: Star History

on:
  schedule:
    - cron: "17 2 * * *"
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Update star history chart
        uses: narayann7/star-history-action@a68d8f9d67ca20d55b682a264e69152dcf326e9c # v1.0.4
        with:
          repos: ${{ github.repository }}
          output-dir: assets/star-history
          type: Date
          themes: light,dark
          update-readme: true
          readme: README.md
          readme-format: picture
          commit-message: "chore: update star history [skip ci]"
