name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    name: Build wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Verify release tag
        shell: bash
        run: |
          expected_tag="$(python -c \
            'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "$expected_tag"

      - name: Install verification dependencies
        run: uv sync --locked --no-install-project

      - name: Generate SBOM
        run: uv run --no-sync python tools/generate_sbom.py

      - name: Set reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.14.1
          rust-toolchain: "1.96.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e SOURCE_DATE_EPOCH
          args: --release --locked --compatibility pypi --out dist

      - name: Verify wheel on Python 3.11 through 3.14
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name 'relify-*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python tools/verify_release.py "$wheel"

      - name: Upload verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/relify-*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish wheels to PyPI
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/relify
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download verified wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Verify release bundle
        shell: bash
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name 'relify-*.whl' | sort)
          test "${#wheels[@]}" -eq 2
          sha256sum "${wheels[@]}" > SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/relify-*.whl
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
