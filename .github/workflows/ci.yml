name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python and Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci

      - name: Sync environment
        run: make sync

      - name: Build native extension
        run: make develop

      - name: Run quality gates
        run: make check

  wheel:
    name: ABI3 wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
    env:
      CARGO_BUILD_JOBS: "2"
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install verification dependencies
        run: uv sync --locked --no-install-project

      - name: Generate SBOM
        run: uv run --no-sync python tools/generate_sbom.py

      - name: Set reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.14.1
          rust-toolchain: "1.96.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e SOURCE_DATE_EPOCH
          args: --release --locked --compatibility pypi --out dist

      - name: Remove first build artifacts
        shell: bash
        run: rm -rf target

      - name: Rebuild wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.14.1
          rust-toolchain: "1.96.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e SOURCE_DATE_EPOCH
          args: --release --locked --compatibility pypi --out rebuilt

      - name: Remove rebuilt artifacts
        shell: bash
        run: rm -rf target

      - name: Verify wheel on Python 3.11 through 3.14
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name 'relify-*.whl' -print -quit)"
          test -n "$wheel"
          rebuilt="rebuilt/$(basename "$wheel")"
          uv run --no-sync python tools/verify_release.py \
            "$wheel" --rebuilt-wheel "$rebuilt"
