name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      browser_only: ${{ steps.scope.outputs.browser_only }}
      browser_changed: ${{ steps.scope.outputs.browser_changed }}
      base: ${{ steps.scope.outputs.base }}

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Classify changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi

          docs_only=true
          browser_only=true
          browser_changed=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|assets/*|.github/workflows/star-history.yml) ;;
              browser/*|rust/parqdb-browser-kernels/*|rust/parqdb-kernels/*)
                docs_only=false
                browser_changed=true
                ;;
              *)
                docs_only=false
                browser_only=false
                ;;
            esac
          done < <(git diff --name-only -z "$base" "$GITHUB_SHA")

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "browser_only=$browser_only" >> "$GITHUB_OUTPUT"
          echo "browser_changed=$browser_changed" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation checks
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Run documentation checks
        shell: bash
        run: |
          uv run --no-project --with markdown-it-py python tools/check_docs.py
          git diff --check "${{ needs.scope.outputs.base }}" "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for path in Path("assets").glob("*.svg"):
              ElementTree.parse(path)
          PY

  python:
    name: Python checks
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.browser_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.96.0"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci
          save-if: false

      - name: Sync environment
        run: make sync

      - name: Build native extension
        run: make develop-debug

      - name: Run Python checks
        run: make check-python

  wheel:
    name: Installed wheel checks
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.browser_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.96.0"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci
          save-if: false

      - name: Install build and verification dependencies
        run: uv sync --locked --no-install-project

      - name: Build wheel
        run: uv run --no-sync maturin build --release --locked --compatibility pypi --out dist

      - name: Verify installed wheel on Python 3.11
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name 'parqdb-*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python tools/verify_release.py "$wheel" --python 3.11

  rust:
    name: Rust checks
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.browser_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci

      - name: Run Rust checks
        run: make check-rust

  security:
    name: Dependency audit
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install Rust and cargo-deny
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.96.0"

      - name: Install audit dependencies
        run: |
          make sync
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit locked dependencies
        run: make audit

  browser:
    name: Browser checks
    needs: scope
    if: needs.scope.outputs.browser_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - name: Install browser dependencies
        working-directory: browser
        run: npm ci

      - name: Audit browser dependencies
        working-directory: browser
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Build WebAssembly kernel
        run: cargo build --locked --release --target wasm32-unknown-unknown -p parqdb-browser-kernels

      - name: Run browser checks
        working-directory: browser
        run: |
          npm run check
          npm test
