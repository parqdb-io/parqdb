[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "relify"
version = "0.1.0rc2"
description = "Lightweight vector index extension for the open lakehouse stack"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "vendor/arrow-rs/parquet/LICENSE.txt",
    "vendor/datafusion/datasource-parquet/LICENSE.txt",
    "vendor/datafusion-python/LICENSE.txt",
]
keywords = ["vector-search", "lakehouse", "iceberg", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "cloudpickle>=2.0",
    "pyarrow>=18",
    "typing-extensions; python_version < '3.13'",
]

[project.optional-dependencies]
iceberg = [
    "pyiceberg>=0.10,<1",
]
spark = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyiceberg>=0.10,<1",
    "pyspark>=4,<4.2",
]
starrocks = [
    "adbc-driver-flightsql>=1.12,<2",
    "pyiceberg>=0.10,<1",
]

[project.urls]
Documentation = "https://github.com/petrizhang/relify/blob/main/docs/README.md"
Repository = "https://github.com/petrizhang/relify"
Issues = "https://github.com/petrizhang/relify/issues"

[dependency-groups]
benchmark = [
    "h5py>=3.12,<4",
    "numpy>=1.26,<3",
]
benchmark-faiss = [
    { include-group = "benchmark" },
    "faiss-cpu>=1.14,<1.15",
]
wheel-test = [
    "duckdb>=1.5,<1.6",
    "pyiceberg[sql-sqlite]>=0.10,<1",
    "pytest>=8.3",
]
dev = [
    { include-group = "benchmark" },
    { include-group = "wheel-test" },
    "markdown-it-py>=4,<5",
    "maturin>=1.9,<2",
    "pip-audit>=2.10,<3",
    "pyright[nodejs]>=1.1.400,<2",
    "ruff>=0.12,<1",
]

# PySpark publishes only a large sdist, so provide its base package metadata to
# keep universal dependency resolution metadata-only.
[[tool.uv.dependency-metadata]]
name = "pyspark"
version = "4.1.3"
requires-python = ">=3.10"
requires-dist = ["py4j>=0.10.9.7,<0.10.9.10"]

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
module-name = "relify._native"
include = ["relify/datasets/*.parquet"]
strip = true

[tool.maturin.sbom]
rust = false
include = ["sboms/relify-python.cyclonedx.json"]

[tool.pytest.ini_options]
testpaths = ["tests/integration", "tests/interop", "tests/python"]

[tool.ruff]
extend-exclude = ["python/relify/datafusion"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PYI", "RUF", "UP"]

[tool.pyright]
exclude = ["python/relify/datafusion"]
include = ["python/relify", "examples/python"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
