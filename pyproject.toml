[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "parqdb"
version = "0.2.0rc3"
description = "Lightweight vector index extension for the open lakehouse stack"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "vendor/arrow-rs/parquet/LICENSE.txt",
    "vendor/datafusion/datasource-parquet/LICENSE.txt",
    "vendor/datafusion-python/LICENSE.txt",
]
keywords = ["vector-search", "lakehouse", "iceberg", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "cloudpickle>=2.0",
    "httpx>=0.28,<1",
    "pyarrow>=18",
    "starlette>=1.3.1,<2",
    "typing-extensions; python_version < '3.13'",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
iceberg = [
    "pyiceberg>=0.10,<1",
]
publish = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
]
[project.scripts]
parqdb = "parqdb.cli:main"

[project.urls]
Documentation = "https://github.com/parqdb-io/parqdb/blob/main/docs/README.md"
Repository = "https://github.com/parqdb-io/parqdb"
Issues = "https://github.com/parqdb-io/parqdb/issues"

[dependency-groups]
benchmark = [
    "h5py>=3.12,<4",
    "numpy>=1.26,<3",
]
benchmark-faiss = [
    { include-group = "benchmark" },
    "faiss-cpu>=1.14,<1.15",
]
wheel-test = [
    "duckdb>=1.5,<1.6",
    "numpy>=1.26,<3",
    "pyiceberg[sql-sqlite]>=0.10,<1",
    "pytest>=8.3",
]
dev = [
    { include-group = "benchmark" },
    { include-group = "wheel-test" },
    "markdown-it-py>=4,<5",
    "maturin>=1.9,<2",
    "pip-audit>=2.10,<3",
    "pyright[nodejs]>=1.1.400,<2",
    "ruff>=0.12,<1",
]

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
module-name = "parqdb._native"
include = ["parqdb/datasets/*.parquet"]
strip = true

[tool.maturin.sbom]
rust = false
include = ["sboms/parqdb-python.cyclonedx.json"]

[tool.pytest.ini_options]
testpaths = ["tests/integration", "tests/interop", "tests/python"]

[tool.ruff]
extend-exclude = ["python/parqdb/datafusion"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PYI", "RUF", "UP"]

[tool.pyright]
exclude = ["python/parqdb/datafusion"]
include = ["python/parqdb", "examples/python"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
