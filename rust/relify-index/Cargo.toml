[package]
name = "relify-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Backend-neutral Relify index repository and publication"
repository.workspace = true
publish = false

[lib]
name = "relify_index"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bytes.workspace = true
relify-catalog = { version = "0.1.0-rc.1", path = "../relify-catalog", default-features = false }
relify-core = { version = "0.1.0-rc.1", path = "../relify-core" }
relify-meta = { version = "0.1.0-rc.1", path = "../relify-meta" }
relify-storage = { version = "0.1.0-rc.1", path = "../relify-storage" }
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
relify-catalog = { version = "0.1.0-rc.1", path = "../relify-catalog" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
url.workspace = true
