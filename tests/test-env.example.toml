# Copy this file to tests/test-env.toml. The local file is ignored by Git.
# Omit any section for a capability that should be skipped.

[s3]
uri = "s3://relify-test"
endpoint = "http://127.0.0.1:9000"
access_key = "${AWS_ACCESS_KEY_ID}"
secret_key = "${AWS_SECRET_ACCESS_KEY}"
region = "us-east-1"

[hdfs]
uri = "hdfs://127.0.0.1:9000/relify-test"

[iceberg]
name = "lakehouse"
properties_json = "${RELIFY_ICEBERG_PROPERTIES}"

[spark]
iceberg_version = "1.11.0"

[starrocks]
flight_uri = "grpc://127.0.0.1:9408"
catalog_name = "lakehouse"
# Delete this optional line when no ADBC database options are required.
db_kwargs_json = "${RELIFY_STARROCKS_DB_KWARGS}"
