[s3]
uri = "s3://relify-test"
endpoint = "http://127.0.0.1:9000"
access_key = "${AWS_ACCESS_KEY_ID}"
secret_key = "${AWS_SECRET_ACCESS_KEY}"
region = "us-east-1"

[hdfs]
uri = "hdfs://127.0.0.1:9000/relify-test"

[iceberg]
name = "lakehouse"
properties_json = "${RELIFY_ICEBERG_PROPERTIES}"
