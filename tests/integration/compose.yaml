name: relify-integration

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: relify
      MINIO_ROOT_PASSWORD: relify-secret
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - minio-data:/data

volumes:
  minio-data:
